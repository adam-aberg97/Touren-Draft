<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draften – Touren 2026</title>
<style>
  :root {
    --bg: #0f2e1a; --bg2: #143a22; --paper: #f7f5ee; --ink: #15211a;
    --jacob: #f4b400; --johan: #ec6854; --adam: #6eb0ec; --muted: #9fb3a5;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--paper); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 18px 16px 40px; }
  h1 { font: 700 30px/1.1 Georgia, "Times New Roman", serif; margin: 4px 0 2px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
  .row { display: flex; gap: 8px; align-items: center; justify-content: flex-end; }
  .ctrl button { font: 600 14px system-ui; border-radius: 10px; border: 0; padding: 9px 12px; cursor: pointer; background: var(--bg2); color: var(--paper); }
  .ctrl button:focus-visible, .p:focus-visible { outline: 3px solid var(--paper); outline-offset: 2px; }

  .strip { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; margin: 12px 0 6px; }
  .slot { height: 34px; border-radius: 6px; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--ink); opacity: .35; }
  .slot.done { opacity: .6; }
  .slot.now { opacity: 1; outline: 3px solid var(--paper); outline-offset: 1px; }
  .now-line { font: 600 15px/1.3 system-ui; margin: 8px 0 14px; }
  .now-line b { font-size: 20px; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 18px; }
  .p { background: var(--bg2); border: 0; border-radius: 12px; padding: 11px 12px; text-align: left; color: var(--paper); font: inherit; cursor: pointer; min-height: 60px; }
  .p .n { font-weight: 700; font-size: 15px; display: block; }
  .p .m { font-size: 13px; color: var(--muted); }
  .p.taken { opacity: .45; cursor: default; }
  .p.taken .n { text-decoration: line-through; }
  .badge { display: inline-block; font-size: 11px; font-weight: 800; color: var(--ink); border-radius: 99px; padding: 1px 7px; margin-left: 4px; text-decoration: none; }

  .teams { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .team { background: var(--paper); color: var(--ink); border-radius: 12px; padding: 10px 10px 8px; border-top: 6px solid; font-size: 14px; }
  .team h3 { font: 700 17px Georgia, serif; margin: 0 0 6px; }
  .team ol { margin: 0; padding-left: 18px; }
  .team li { padding: 2px 0; }
  .team .cap { font-weight: 700; }
  .team .sum { margin-top: 8px; padding-top: 6px; border-top: 1px solid #ddd8c8; font-size: 12.5px; color: #4d5c52; }
</style>
</head>
<body>
<main>
  <h1>Draften</h1>
  <p class="sub">Snake order. Tryck på spelaren som väljs.</p>

  <div class="row ctrl">
    <button id="undo">Ångra</button>
    <button id="reset">Börja om</button>
  </div>

  <div class="strip" id="strip"></div>
  <div class="now-line" id="nowLine"></div>

  <div class="grid" id="grid"></div>
  <div class="teams" id="teams"></div>
</main>

<script>
const P = {
  Karl: 2, Anton: 5, Pontus: 10, Per: 21, Mathias: 29, Eric: 19,
  Filip: 8, Arvid: 8, Philip: 11, WilliamA: 9, WilliamE: 20, Harmke: 15,
};
const FULL = {
  Karl: 'Karl Setterberg', Anton: 'Anton Jernå', Pontus: 'Pontus Govenius', Per: 'Per Molander',
  Mathias: 'Mathias Lien', Eric: 'Eric Hartmanis', Filip: 'Filip Wallersköld', Arvid: 'Arvid Rosberg',
  Philip: 'Philip Melin', WilliamA: 'William Adelbertson', WilliamE: 'William Eriksson', Harmke: 'Harmke Lüken',
};
const CAPTAINS = { Jacob: 8, Johan: 4, Adam: 7 };
const ORDER = ['Jacob','Johan','Adam','Adam','Johan','Jacob','Jacob','Johan','Adam','Adam','Johan','Jacob'];
const COLORS = { Jacob: 'var(--jacob)', Johan: 'var(--johan)', Adam: 'var(--adam)' };

let picks = [];
const $ = id => document.getElementById(id);
const teamOf = who => picks.filter(x => x.who === who).map(x => x.p);
const short = k => FULL[k].split(' ')[0] + (k === 'WilliamA' ? ' A' : k === 'WilliamE' ? ' E' : '');

function render() {
  const i = picks.length;
  $('strip').innerHTML = ORDER.map((w, k) =>
    `<div class="slot ${k < i ? 'done' : ''} ${k === i ? 'now' : ''}" style="background:${COLORS[w]}" title="Val ${k + 1}: ${w}">${k + 1}</div>`).join('');
  $('nowLine').innerHTML = i < 12
    ? `Val ${i + 1}: <b style="color:${COLORS[ORDER[i]]}">${ORDER[i]}</b> väljer`
    : '<b>Draften är klar</b>';

  $('grid').innerHTML = Object.keys(P).map(k => {
    const t = picks.find(x => x.p === k);
    return `<button class="p ${t ? 'taken' : ''}" data-k="${k}" ${t ? 'disabled' : ''}>
      <span class="n">${FULL[k]}${t ? `<span class="badge" style="background:${COLORS[t.who]}">${t.who}</span>` : ''}</span>
      <span class="m">Hcp ${P[k]}</span></button>`;
  }).join('');
  document.querySelectorAll('.p:not(.taken)').forEach(b => b.onclick = () => {
    if (picks.length >= 12) return;
    picks.push({ who: ORDER[picks.length], p: b.dataset.k });
    render(); save();
  });

  $('teams').innerHTML = Object.keys(CAPTAINS).map(c => {
    const m = teamOf(c);
    const all = [CAPTAINS[c], ...m.map(k => P[k])];
    const avg = (all.reduce((a, b) => a + b, 0) / all.length).toFixed(1);
    return `<div class="team" style="border-color:${COLORS[c]}"><h3>Lag ${c}</h3><ol>
      <li class="cap">${c} (${CAPTAINS[c]})</li>${m.map(k => `<li>${short(k)} (${P[k]})</li>`).join('')}</ol>
      <div class="sum">${all.length}/5 spelare · snitt-hcp ${avg}</div></div>`;
  }).join('');
}

function save() { try { localStorage.setItem('touren-draft', JSON.stringify(picks)); } catch (e) {} }
function load() {
  try { const v = localStorage.getItem('touren-draft'); if (v) picks = JSON.parse(v) || []; } catch (e) {}
  render();
}
$('undo').onclick = () => { picks.pop(); render(); save(); };
$('reset').onclick = () => { if (confirm('Börja om draften?')) { picks = []; render(); save(); } };
render();
load();
</script>
</body>
</html>
