<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draft till Calanova Cup – Touren 2026</title>
<style>
  :root {
    --bg: #0f2e1a; --bg2: #143a22; --paper: #f7f5ee; --ink: #15211a;
    --jacob: #f4b400; --johan: #ec6854; --adam: #6eb0ec; --muted: #9fb3a5;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--paper); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 18px 16px 40px; }
  header { display: flex; align-items: center; gap: 14px; }
  header img { width: 64px; height: 64px; flex: none; }
  .kicker { font: 700 13px/1 system-ui; letter-spacing: .18em; color: var(--jacob); text-transform: uppercase; margin-bottom: 4px; }
  h1 { font: 700 30px/1.1 Georgia, "Times New Roman", serif; margin: 0; }
  .sub { color: var(--muted); font-size: 14px; margin: 10px 0 14px; }
  .row { display: flex; gap: 8px; align-items: center; justify-content: flex-end; flex-wrap: wrap; margin-top: 12px; }
  .ctrl { display: flex; gap: 8px; }
  .ctrl button { font: 600 14px system-ui; border-radius: 10px; border: 0; padding: 9px 12px; cursor: pointer; background: var(--bg2); color: var(--paper); }
  .ctrl button:focus-visible, .p:focus-visible { outline: 3px solid var(--paper); outline-offset: 2px; }

  .strip { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; margin: 14px 0 6px; }
  .slot { height: 34px; border-radius: 6px; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--ink); opacity: .35; }
  .slot.done { opacity: .6; }
  .slot.now { opacity: 1; outline: 3px solid var(--paper); outline-offset: 1px; }
  .now-line { font: 600 15px/1.3 system-ui; margin: 8px 0 14px; }
  .now-line b { font-size: 20px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-bottom: 22px; }
  .p { display: flex; align-items: center; gap: 10px; background: var(--bg2); border: 0; border-radius: 12px; padding: 10px; text-align: left; color: var(--paper); font: inherit; cursor: pointer; min-height: 62px; }
  .p .n { font-weight: 700; font-size: 15px; line-height: 1.2; }
  .p.taken { opacity: .4; cursor: default; }
  .p.taken .n { text-decoration: line-through; }
  .badge { display: inline-block; font-size: 11px; font-weight: 800; color: var(--ink); border-radius: 99px; padding: 1px 7px; margin-top: 4px; }

  .av { width: 40px; height: 40px; border-radius: 50%; flex: none; overflow: hidden; display: grid; place-items: center; background: #2b4a35; color: var(--paper); font: 700 14px system-ui; position: relative; }
  .av img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .teams { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
  .team { border-radius: 14px; padding: 30px 10px 10px; position: relative; margin-top: 14px; }
  .team h3 { position: absolute; top: -14px; left: 50%; transform: translateX(-50%); margin: 0; background: var(--paper); border-radius: 8px; padding: 4px 16px; font: 800 16px/1.2 system-ui; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
  .tslots { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .ts { background: #e9ecea; border-radius: 8px; aspect-ratio: 3 / 4; overflow: hidden; position: relative; display: flex; flex-direction: column; }
  .ts .ph { flex: 1; display: grid; place-items: center; background: #dfe3e0; overflow: hidden; }
  .ts .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ts .ph .ini { font: 800 22px system-ui; color: #4b5a50; }
  .ts .nm { background: #fff; color: var(--ink); font: 700 11px/1.2 system-ui; text-align: center; padding: 3px 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ts .c { position: absolute; top: 4px; left: 4px; background: var(--ink); color: #fff; font: 800 10px system-ui; border-radius: 99px; padding: 1px 6px; }
  .ts.new { animation: pop .35s ease-out; }
  @keyframes pop { from { transform: scale(.85); opacity: .3; } to { transform: scale(1); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .ts.new { animation: none; } }
  .music { margin: 14px 0 0; display: flex; gap: 14px; align-items: center; background: var(--bg2); border-radius: 14px; padding: 10px; }
  .music iframe { display: block; width: 200px; height: 113px; flex: none; border: 0; border-radius: 10px; }
  .mtxt { display: flex; flex-direction: column; gap: 2px; font-size: 14px; color: var(--muted); }
  .mtxt b { color: var(--paper); font-size: 17px; }
</style>
</head>

const IMG = k => PHOTOS[k] || `bilder/${k}.jpg`;

let picks = [];
let lastPick = null;
const $ = id => document.getElementById(id);
const teamOf = who => picks.filter(x => x.who === who).map(x => x.p);
const fullName = k => PLAYERS[k] || CAPFULL[k];
const first = k => { const n = fullName(k).split(' ')[0]; return k === 'williama' ? 'William A' : k === 'williame' ? 'William E' : n; };
const initials = k => fullName(k).split(' ').map(s => s[0]).join('').slice(0, 2);
const photo = (k, cls) => `<img src="${IMG(k)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'${cls}',textContent:'${initials(k)}'}))">`;

function render() {
  const i = picks.length;
  $('strip').innerHTML = ORDER.map((w, k) =>
    `<div class="slot ${k < i ? 'done' : ''} ${k === i ? 'now' : ''}" style="background:${COLORS[w]}" title="Val ${k + 1}: ${w}">${k + 1}</div>`).join('');
  $('nowLine').innerHTML = i < 12
    ? `Val ${i + 1}: <b style="color:${COLORS[ORDER[i]]}">${ORDER[i]}</b> väljer`
    : '<b>Draften är klar</b>';

  $('grid').innerHTML = Object.keys(PLAYERS).map(k => {
    const t = picks.find(x => x.p === k);
    return `<button class="p ${t ? 'taken' : ''}" data-k="${k}" ${t ? 'disabled' : ''}>
      <span class="av">${photo(k, 'ini')}</span>
      <span><span class="n">${PLAYERS[k]}</span>${t ? `<br><span class="badge" style="background:${COLORS[t.who]}">${t.who}</span>` : ''}</span>
    </button>`;
  }).join('');
  document.querySelectorAll('.p:not(.taken)').forEach(b => b.onclick = () => {
    if (picks.length >= 12) return;
    picks.push({ who: ORDER[picks.length], p: b.dataset.k });
    lastPick = b.dataset.k;
    render(); save();
  });

  $('teams').innerHTML = Object.keys(CAPTAINS).map(c => {
    const members = [CAPTAINS[c], ...teamOf(c)];
    const cells = [];
    for (let s = 0; s < 5; s++) {
      const k = members[s];
      if (k) {
        cells.push(`<div class="ts ${k === lastPick ? 'new' : ''}">${s === 0 ? '<span class="c">C</span>' : ''}
          <div class="ph">${photo(k, 'ini')}</div><div class="nm">${first(k)}</div></div>`);
      } else {
        cells.push(`<div class="ts"><div class="ph"><svg viewBox="0 0 40 50" width="60%" aria-hidden="true"><circle cx="20" cy="16" r="9" fill="#c4cbc6"/><path d="M4 50c0-11 7-18 16-18s16 7 16 18z" fill="#c4cbc6"/></svg></div><div class="nm">&nbsp;</div></div>`);
      }
    }
    return `<div class="team" style="background:${COLORS[c]}"><h3 style="color:${TEXTC[c]}">Lag ${c}</h3>
      <div class="tslots">${cells.join('')}</div></div>`;
  }).join('');
  lastPick = null;
}

function save() { try { localStorage.setItem('touren-draft-v2', JSON.stringify(picks)); } catch (e) {} }
function load() {
  try { const v = localStorage.getItem('touren-draft-v2'); if (v) picks = JSON.parse(v) || []; } catch (e) {}
  render();
}
$('undo').onclick = () => { picks.pop(); render(); save(); };
$('reset').onclick = () => { if (confirm('Börja om draften?')) { picks = []; render(); save(); } };
load();
</script>
